<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formato de Cierre Final</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .row-grid { 
            display: grid; 
            grid-template-columns: 40% 60%; 
            border-bottom: 1px solid #e5e7eb; 
        }
        .cell-label { 
            background: #f9fafb; 
            padding: 8px 12px; 
            font-weight: 600; 
            font-size: 0.75rem; 
            border-right: 1px solid #e5e7eb; 
            display: flex; 
            align-items: center; 
            color: #4b5563;
        }
        .section-header { 
            background: #4b5563; 
            color: white; 
            padding: 6px 12px; 
            font-weight: bold; 
            font-size: 0.75rem; 
            grid-column: span 2; 
            letter-spacing: 0.05em;
        }
        /* Estilos personalizados para simular las pestañas de Excel */
        .excel-tab {
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            transition: all 0.2s ease;
        }
        /* Estilos para el selector emergente de hora 24h */
        .time-picker-popover {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Notificación integrada en pantalla -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl flex items-center gap-2">
        <span id="toast-icon">✨</span>
        <span id="toast-message">Copiado con éxito</span>
    </div>

    <!-- Modal de confirmación para restablecer -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 text-center transform transition-all">
            <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                ⚠️
            </div>
            <h3 class="text-base font-bold text-gray-900 mb-2">¿Restablecer todo?</h3>
            <p class="text-xs text-gray-500 mb-6">Esta acción borrará todas las pestañas y su información.</p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirmModal(false)" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg transition">
                    Cancelar
                </button>
                <button onclick="closeConfirmModal(true)" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-lg transition">
                    Sí, reiniciar
                </button>
            </div>
        </div>
    </div>

    <div id="app"></div>

    <script>
        // Catálogo actualizado y expandido de Códigos y Motivos
        const codigosYMotivos = {
            "CANCELADO": ["SERVICIO RESTABLECE CON IDC EN TRANSITO", "SE CANCELA IDC EN TRANSITO", "SE SOLICITA CANCELAR ANTES DE ASIGNAR IDC"],
            "CONFIGURACIÓN DE EQUIPOS": ["CUALQUIER CONFIGURACIÓN DE EQUIPO PERTENECIENTE A TE"],
            "CONFIGURACIÓN DE ONT": ["CUALQUIER CONFIGURACIÓN DE ONT COMO ACTIVIDAD PRINCIPAL"],
            "CORRECCIÓN DE CONEXIONES": ["CAMBIO DE PUERTOS", "CONEXION, NO ESTABAN CONECTADOS", "REMPLAZO DE CABLE"],
            "DIRECCIÓN ERRONEA": ["SE ACUDE A SITIO Y NO ES EL SITIO CORRECTO", "NOS PIDEN MOVERNOS A UN SITIO CERCANO", "DIRECCIÓN INCORRECTA EN SM"],
            "EQUIPO DAÑADO": ["SE DIAGNOSTICA DAÑO EN EL EQUIPO", "DAÑO POR FAUNA", "DAÑO POR VANDALISMO", "SE RECOMIENDA HACER UNA REUBICACIÓN DE EQUIPOS"],
            "FALLA DE ENERGÍA": ["CLIENTE APAGO LOS EQUIPOS", "CORTES DE ENERGIA POR CONDICIONES CLIMATICAS", "SIN ENERGÍA ELCTRICA", "PROBLEMAS CON LA INSTALACIÓN"],
            "FALLA DE MEDIO": ["FALLA DE TRANSMISIONES", "SE DIAGNOSTICA DAÑO EN EL EQUIPO DE Tx", "CAMBIO DE EQUIPO POR PARTE DE Tx", "SE HACE CITA EN CONJUNTO Y SE DETERMINA FALLO DE MEDIO"],
            "OTRO": ["FALLA EN EL CABLEADO", "FALLA EN FIBRA OPTICA", "EQUIPOS MOJADOS", "VISITA DE INSPECCIÓN", "LEVANTAMIENTOS", "RESET DE EQUIPO", "VISITA EN CONJUNTO, SIN INTERVENCION POR PARTE DE IDC", "RECOLECCION DE EQUIPO", "REMODELACION O CONSTRUCCION EN SITIO", "CALENTAMIENTO DE EQUIPOS POR FALTA DE VENTILACION", "DESINTALACION DE EQUIPO", "ROBO DE EQUIPO", "ACTUALIZACION DE EQUIPOS", "SE ENTREGA EQUIPO A SITIO", "SE REALIZA LIMPIEZA DE EQUIPO", "PRESTAMO DE EQUIPO"],
            "REEMPLAZO DE EQUIPO": ["CAMBIO DE CUALQUIER EQUIPO GESTIONADO POR TELMEX", "REEMPLAZO DE EQUIPO POR PARTE DE TX"],
            "SIN ACCESO": ["NO SE TRAMITO ACCESO", "CLIENTE NO ESTABA EN SITIO", "IDC NO CUMPLE CON LOS REQUISITOS", "NO LLEGA TX A VISITA EN CONJUNTO", "NO LLEGA VALORES A DAR ACCESO A EQUIPO", "CLIENTE NO DA VT", "NO SE ESTABLECE COMUNICACION CON LA MESA Y PIDEN RETIRARNOS"],
            "SIN FALLA": ["SOLICITAN PRUEBAS", "REVISIÓN DE CONDICIONES DE SITE", "REVISIÓN DE CONEXIONES", "SE LLEGA A SITIO Y PIDEN RETIRARNOS", "REVISIÓN DE CONDICIONES DEL EQUIPO", "SERVICIO DADO DE BAJA", "SERVICIO ACTIVO"],
            "SOLICITUD ERRONEA": ["SIN EQUIPOS EN SITIO", "EQUIPO REPORTADO NO ES CORRECTO", "ACTIVIDAD PERTENECE A UNA IMPLEMENTACIÓN"],
            "EQUIPO NO REEMPLAZADO": ["EQUIPO SIN DAÑO", "EQUIPO LLEGO DAÑADO", "EQUIPO A PRESTAMO", "NO SE CONTO CON VT", "SIN VT POR PARTE DE CLIENTE PARA REMPLAZO"],
            "GUARDIA": ["IDC REALIZA GUARDIA EN SITIO"],
            "CABLEADO": ["REMPLAZO DE CABLE", "REPARACION DE CABLEADO", "ETIQUETADO", "PEINADO DE CABLEADO EN SITIO", "REPARACION DE FIBRA OPTICA"],
            "REPROGRAMADO": ["BLOQUEO RUMBO A SITIO", "SE REPROGRAMA A PETICION DE CLENTE", "SE REPORGRAMA A PETICION DE CSC"]
        };

        // Estado Global de la aplicación
        let sheets = [];
        let activeSheetId = null;
        let activeTimePicker = null; // Guardar id de selector activo

        // Generar estructura vacía para una nueva pestaña
        function createInitialData(customName) {
            return {
                id: Date.now() + Math.random(),
                name: customName || `Hoja ${sheets.length + 1}`,
                data: { 
                    estatus: '', 
                    codigoCierre: '', 
                    motivoCierre: '', 
                    etaLlegada: '', 
                    nombreIdc: '', 
                    fallaReportada: '', 
                    fallaDetectada: '', 
                    equipoRevisado: '', 
                    accionCorrectiva: '', 
                    horarioLlegada: '', 
                    horarioAcceso: '', 
                    horarioSolucion: '', 
                    horarioSalida: '', 
                    nombreClienteValida: '', 
                    nombreCentroValida: '', 
                    bitacora: '', 
                    atencionCentro: 'Buena', 
                    servicioQuedo: 'Concluido', 
                    atencionSc: 'Buena', 
                    dirFisicaCorrecta: 'SI', 
                    dirCorrecta: 'N/A', 
                    afectacionServicio: 'SI', 
                    conexionesCorrectas: 'NA (SIN ACCESO)', 
                    equiposDesconectados: 'NA (SIN ACCESO)', 
                    energiaElectrica: 'NA (SIN ACCESO)', 
                    tornillosBarridos: 'NA (SIN ACCESO)', 
                    equiposMontados: 'NA (SIN ACCESO)', 
                    refaccionInstalada: '', 
                    modelo: '', 
                    nsRefaccionInstalada: '', 
                    nsRefaccionRetirada: '', 
                    rma: '', 
                    refaccionSeQueda: 'NO', 
                    motivoSeQueda: 'NA', 
                    personalAutoriza: 'NA' 
                }
            };
        }

        // Inicializador principal
        function init() {
            const firstSheet = createInitialData('Hoja 1');
            sheets = [firstSheet];
            activeSheetId = firstSheet.id;
            render();
        }

        // Sistema dinámico de Toast de confirmación
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-message');
            
            icon.textContent = isError ? '❌' : '📋';
            msg.textContent = message;
            
            toast.className = `fixed bottom-5 right-5 z-50 transform translate-y-0 opacity-100 transition-all duration-300 px-6 py-3 rounded-lg shadow-xl flex items-center gap-2 ${isError ? 'bg-red-600 text-white' : 'bg-green-600 text-white'}`;
            
            setTimeout(() => {
                toast.className = "fixed bottom-5 right-5 z-50 transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-xl flex items-center gap-2";
            }, 3000);
        }

        // Renderizado general de la interfaz
        function render() {
            const container = document.getElementById('app');
            const activeSheet = sheets.find(s => s.id === activeSheetId) || sheets[0];
            
            if (!activeSheet) return;

            container.innerHTML = `
                <!-- Barra de Navegación y Acciones Superiores -->
                <header class="bg-gray-900 text-white sticky top-0 z-40 shadow-md">
                    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xl">📊</span>
                            <h1 class="text-lg font-bold tracking-tight">Formato de Cierre Final</h1>
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-2">
                            <!-- Enlace directo de redirección -->
                            <a href="https://sm.cnoc.telmexit.com/sm/index.do?_" target="_blank" rel="noopener noreferrer" 
                               class="bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-semibold py-2 px-3 rounded flex items-center gap-1.5 transition duration-150 shadow-sm">
                                🌐 Abrir CNOC SM
                            </a>
                            <button onclick="copyActiveSheet()" 
                                    class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-3 rounded flex items-center gap-1.5 transition duration-150 shadow-sm"
                                    title="Copia los datos de esta pestaña sin el encabezado">
                                📋 Copiar Hoja Activa
                            </button>
                            <button onclick="openConfirmModal()" 
                                    class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold py-2 px-3 rounded flex items-center gap-1.5 transition duration-150 shadow-sm">
                                🧹 Restablecer Todo
                            </button>
                        </div>
                    </div>

                    <!-- Navegación de Pestañas estilo Excel -->
                    <div class="bg-gray-800 border-t border-gray-700">
                        <div class="max-w-7xl mx-auto px-4 flex items-end pt-2 overflow-x-auto gap-1">
                            ${sheets.map(s => {
                                const isActive = s.id === activeSheetId;
                                return `
                                    <div class="group relative flex items-center">
                                        <button onclick="setActiveSheet(${s.id})" 
                                            class="excel-tab px-4 py-2 text-xs font-semibold transition-all duration-150 whitespace-nowrap flex items-center gap-2 
                                            ${isActive 
                                                ? 'bg-white text-gray-900 font-bold border-t-2 border-emerald-500 shadow-sm' 
                                                : 'bg-gray-700 text-gray-300 hover:bg-gray-650 hover:text-white'}">
                                            <span>📁 ${s.name}</span>
                                        </button>
                                        ${sheets.length > 1 ? `
                                            <button onclick="deleteSheet(${s.id}, event)" 
                                                class="absolute -top-1.5 -right-1 hidden group-hover:flex bg-red-500 text-white text-[9px] w-4 h-4 rounded-full items-center justify-center hover:bg-red-600 shadow border border-white">
                                                ✕
                                            </button>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                            
                            <!-- Botón agregar hoja dinámica -->
                            <button onclick="addSheet()" 
                                    class="excel-tab px-3 py-2 text-xs font-bold text-emerald-400 bg-gray-800 hover:bg-gray-700 hover:text-emerald-300 transition duration-150 mb-0.5" 
                                    title="Agregar Nueva Hoja">
                                ➕ Nueva Hoja
                            </button>
                        </div>
                    </div>
                </header>

                <main class="max-w-4xl mx-auto p-4 md:p-6">
                    <!-- Contenedor del Formulario Activo -->
                    <div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
                        
                        <!-- Cabecera de la Hoja Seleccionada con opción de renombrar -->
                        <div class="bg-gradient-to-r from-gray-700 to-gray-800 text-white px-4 py-3 flex justify-between items-center border-b border-gray-200">
                            <div class="flex items-center gap-2">
                                <span class="bg-emerald-500 text-white px-2 py-0.5 rounded text-[10px] font-bold">ACTIVA</span>
                                <input type="text" 
                                       value="${activeSheet.name}" 
                                       onchange="renameSheet(${activeSheet.id}, this.value)"
                                       class="bg-transparent font-bold text-sm border-b border-dashed border-gray-400 focus:border-white focus:outline-none px-1 py-0.5 rounded w-48 text-white placeholder-gray-300"
                                       title="Modifica el nombre de la pestaña aquí"
                                       placeholder="Nombre de pestaña" />
                            </div>
                        </div>

                        <!-- Formulario de Campos -->
                        <div class="divide-y divide-gray-100">
                            ${renderFormFields(activeSheet)}
                        </div>

                    </div>
                </main>
            `;

            // Agregar listener global para cerrar el desplegable de hora al hacer clic fuera
            document.onclick = function(e) {
                if (!e.target.closest('.time-picker-container')) {
                    closeAllTimePickers();
                }
            };
        }

        // Helper para renderizar selector de hora en formato 24 hrs con desplegable visual
        function renderTimePickerField(sId, key, currentValue, placeholderText) {
            // Extraer hora y minutos de "HH:MM AM/PM" o "HH:MM"
            const timeOnly = currentValue ? currentValue.split(' ')[0] : '';
            const currentHour = timeOnly ? timeOnly.split(':')[0] : '14';
            const currentMin = timeOnly ? timeOnly.split(':')[1] : '30';
            const pickerId = `picker_${sId}_${key}`;
            const isOpen = activeTimePicker === pickerId;

            return `
                <div class="relative w-full time-picker-container">
                    <div class="flex items-center">
                        <input type="text" 
                               readonly
                               placeholder="${placeholderText}" 
                               class="p-2 w-full text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none cursor-pointer bg-white" 
                               value="${currentValue || ''}" 
                               onclick="toggleTimePicker('${pickerId}', event)">
                        <button type="button" 
                                onclick="toggleTimePicker('${pickerId}', event)" 
                                class="p-2 text-gray-500 hover:text-emerald-600 focus:outline-none text-xs">
                            🕒
                        </button>
                    </div>

                    ${isOpen ? `
                        <div class="absolute right-0 sm:left-0 top-full mt-1 z-50 bg-[#2d2e32] text-white rounded-2xl p-5 shadow-2xl time-picker-popover flex flex-col gap-4 w-72 border border-gray-700">
                            <div class="text-sm font-medium text-gray-300">
                                Selecciona una hora
                            </div>
                            
                            <div class="flex items-center justify-center gap-2 my-1">
                                <!-- Caja Hora -->
                                <div class="flex flex-col items-start flex-1">
                                    <div class="w-full bg-[#2555ab] border border-[#4a82e8] rounded-2xl p-3 flex items-center justify-center shadow-inner">
                                        <input type="number" 
                                               id="h_${pickerId}" 
                                               min="0" 
                                               max="23" 
                                               value="${currentHour}" 
                                               oninput="if(this.value.length>2)this.value=this.value.slice(0,2); if(parseInt(this.value)>23)this.value=23;"
                                               class="w-full text-center text-4xl font-normal bg-transparent text-white focus:outline-none font-sans [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                                    </div>
                                    <span class="text-xs text-gray-400 mt-1.5 ml-1 font-medium">Hora</span>
                                </div>

                                <!-- Dos Puntos Separadores -->
                                <span class="text-3xl font-bold text-white mb-5">:</span>

                                <!-- Caja Minuto -->
                                <div class="flex flex-col items-start flex-1">
                                    <div class="w-full bg-[#3c3e44] hover:bg-[#464850] rounded-2xl p-3 flex items-center justify-center transition">
                                        <input type="number" 
                                               id="m_${pickerId}" 
                                               min="0" 
                                               max="59" 
                                               value="${currentMin}" 
                                               oninput="if(this.value.length>2)this.value=this.value.slice(0,2); if(parseInt(this.value)>59)this.value=59;"
                                               class="w-full text-center text-4xl font-normal bg-transparent text-white focus:outline-none font-sans [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                                    </div>
                                    <span class="text-xs text-gray-400 mt-1.5 ml-1 font-medium">Minuto</span>
                                </div>
                            </div>

                            <!-- Footer de Acciones -->
                            <div class="flex items-center justify-between pt-2">
                                <div class="text-gray-400 hover:text-white cursor-pointer p-1.5 rounded-full hover:bg-gray-800 transition" onclick="toggleTimePicker('${pickerId}', event)">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                </div>
                                <div class="flex items-center gap-3">
                                    <button type="button" 
                                            onclick="closeAllTimePickers()" 
                                            class="px-3 py-1.5 text-sm text-[#8ab4f8] hover:bg-gray-800 rounded-lg font-medium transition">
                                        Cancelar
                                    </button>
                                    <button type="button" 
                                            onclick="applyTimeSelection(${sId}, '${key}', '${pickerId}')" 
                                            class="px-3 py-1.5 text-sm text-[#8ab4f8] hover:bg-gray-800 rounded-lg font-medium transition">
                                        Aceptar
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function toggleTimePicker(id, event) {
            if (event) event.stopPropagation();
            activeTimePicker = activeTimePicker === id ? null : id;
            render();
        }

        function closeAllTimePickers() {
            if (activeTimePicker !== null) {
                activeTimePicker = null;
                render();
            }
        }

        function applyTimeSelection(sId, key, pickerId) {
            let hInput = document.getElementById(`h_${pickerId}`).value;
            let mInput = document.getElementById(`m_${pickerId}`).value;
            
            let hVal = parseInt(hInput, 10);
            let mVal = parseInt(mInput, 10);

            if (isNaN(hVal) || hVal < 0) hVal = 0;
            if (hVal > 23) hVal = 23;

            if (isNaN(mVal) || mVal < 0) mVal = 0;
            if (mVal > 59) mVal = 59;

            const h = String(hVal).padStart(2, '0');
            const m = String(mVal).padStart(2, '0');
            const period = hVal >= 12 ? 'PM' : 'AM';
            
            const formattedTime = `${h}:${m} ${period}`;
            updateData(sId, key, formattedTime);
            activeTimePicker = null;
            render();
        }

        // Renderizado del formulario para la hoja activa con mapeo de selects
        function renderFormFields(s) {
            const d = s.data;
            const sel = (key, opt) => `
                <div class="w-full relative">
                    <select class="p-2 w-full text-xs text-gray-800 bg-transparent focus:bg-white focus:ring-1 focus:ring-emerald-500 focus:outline-none rounded" 
                            onchange="updateData(${s.id}, '${key}', this.value)">
                        ${opt.map(o => `<option ${d[key] === o ? 'selected' : ''}>${o}</option>`).join('')}
                    </select>
                </div>
            `;

            // Obtener motivos de la categoría y agregar siempre la opción de Escritura Libre al final del desplegable
            const motivosCatalogo = codigosYMotivos[d.codigoCierre] || [];
            const esMotivoPersonalizado = d.codigoCierre && !motivosCatalogo.includes(d.motivoCierre) && d.motivoCierre !== "";

            return `
                <!-- Datos de Estatus -->
                <div class="row-grid">
                    <div class="cell-label">ESTATUS</div>
                    <input class="p-2 w-full text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none" 
                           value="${d.estatus}" placeholder="Escribe estatus de operación..."
                           oninput="updateData(${s.id}, 'estatus', this.value)">
                </div>

                <div class="row-grid">
                    <div class="cell-label">CÓDIGO DE CIERRE</div>
                    <select class="p-2 w-full text-xs bg-transparent focus:outline-none" 
                            onchange="updateData(${s.id}, 'codigoCierre', this.value); updateData(${s.id}, 'motivoCierre', ''); render();">
                        <option value="">Seleccione...</option>
                        ${Object.keys(codigosYMotivos).map(c => `<option ${d.codigoCierre === c ? 'selected' : ''}>${c}</option>`).join('')}
                    </select>
                </div>

                <div class="row-grid">
                    <div class="cell-label">MOTIVO DE CIERRE</div>
                    <div class="flex flex-col gap-1 p-1 w-full">
                        <select class="p-1 w-full text-xs bg-transparent focus:outline-none ${esMotivoPersonalizado ? 'border-b border-gray-200' : ''}" 
                                onchange="handleMotivoChange(${s.id}, this.value)"
                                ${!d.codigoCierre ? 'disabled' : ''}>
                            <option value="">${d.codigoCierre ? 'Seleccione un motivo...' : 'Primero elija código de cierre'}</option>
                            ${motivosCatalogo.map(m => `<option ${d.motivoCierre === m ? 'selected' : ''}>${m}</option>`).join('')}
                            <option value="__CUSTOM__" ${esMotivoPersonalizado ? 'selected' : ''}>✏️ Escribir motivo libremente...</option>
                        </select>
                        ${esMotivoPersonalizado ? `
                            <input type="text" 
                                   class="p-1 w-full text-xs bg-gray-50 focus:bg-white focus:ring-1 focus:ring-emerald-500 focus:outline-none rounded border border-gray-200 mt-1" 
                                   value="${d.motivoCierre || ''}" 
                                   placeholder="Escribe el motivo personalizado..."
                                   oninput="updateData(${s.id}, 'motivoCierre', this.value)">
                        ` : ''}
                    </div>
                </div>

                <div class="row-grid">
                    <div class="cell-label">ETA LLEGADA</div>
                    <input type="date" class="p-2 w-full text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none" 
                           value="${d.etaLlegada}" onchange="updateData(${s.id}, 'etaLlegada', this.value)">
                </div>

                <div class="row-grid">
                    <div class="cell-label">NOMBRE IDC</div>
                    <input class="p-2 w-full text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none" 
                           value="${d.nombreIdc}" oninput="updateData(${s.id}, 'nombreIdc', this.value)">
                </div>

                <div class="row-grid">
                    <div class="cell-label">FALLA REPORTADA</div>
                    <input class="p-2 w-full text-xs focus:ring-1 focus:ring-emerald-500 focus:outline-none" 
                           value="${d.fallaReportada}" oninput="updateData(${s.id}, 'fallaReportada', this.value)">
                </div>

        function handleMotivoChange(sId, value) {
            if (value === '__CUSTOM__') {
                updateData(sId, 'motivoCierre', '');
            } else {
                updateData(sId, 'motivoCierre', value);
            }
            render();
        }

        // Acciones y Lógicas para las pestañas
        function addSheet() { 
            const newSheet = createInitialData();
            sheets.push(newSheet); 
            activeSheetId = newSheet.id;
            render(); 
            showToast(`Nueva pestaña "${newSheet.name}" agregada`);
        }

        function setActiveSheet(id) {
            activeSheetId = id;
            render();
        }

        function renameSheet(id, newName) {
            const sheet = sheets.find(s => s.id === id);
            if (sheet && newName.trim() !== "") {
                sheet.name = newName.trim();
                render();
            }
        }

        function deleteSheet(id, event) {
            event.stopPropagation(); 
            if (sheets.length <= 1) return;
            
            const index = sheets.findIndex(s => s.id === id);
            sheets = sheets.filter(s => s.id !== id);
            
            if (activeSheetId === id) {
                activeSheetId = sheets[Math.max(0, index - 1)].id;
            }
            render();
            showToast('Pestaña eliminada correctamente');
        }

        let pendingReset = false;
        function openConfirmModal() {
            document.getElementById('confirm-modal').classList.remove('hidden');
            document.getElementById('confirm-modal').classList.add('flex');
        }

        function closeConfirmModal(confirm) {
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('confirm-modal').classList.remove('flex');
            if (confirm) {
                init();
                showToast('Hojas limpiadas con éxito');
            }
        }

        function updateData(id, field, value) { 
            const sheet = sheets.find(s => s.id === id);
            if (sheet) {
                sheet.data[field] = value; 
            }
        }
        
        function getFieldsText(sheet) {
            return Object.entries(sheet.data).map(([key, value]) => {
                const label = key.replace(/([A-Z])/g, ' $1').toUpperCase().trim();
                return `${label}: ${value || ''}`;
            }).join('\n');
        }

        function copyActiveSheet() {
            const activeSheet = sheets.find(s => s.id === activeSheetId);
            if (!activeSheet) return;

            const text = getFieldsText(activeSheet);
            performClipboardCopy(text, `Datos de "${activeSheet.name}" copiados al portapapeles`);
        }

        function performClipboardCopy(text, successMessage) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast(successMessage);
                } else {
                    showToast('Ocurrió un inconveniente al copiar.', true);
                }
            } catch (err) {
                showToast('Error de compatibilidad del portapapeles', true);
            }
            document.body.removeChild(textArea);
        }

        // Inicializar la aplicación
        init();
    </script>
